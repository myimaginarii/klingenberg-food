        description: Ét afsnit pr. felt. Træk i et afsnit for at flytte det.
      - name: venuePhoto
        component: foto
        label: Foto af stedet
      - name: team
        label: Holdet
        type: object
        fields:
          - name: text
            label: Tekst
            type: text
          - name: photo
            component: foto
            label: Foto
      - name: method
        label: Fra køkkenet
        type: object
