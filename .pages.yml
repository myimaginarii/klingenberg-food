  # =================================================================================
  # KONTAKT OG ÅBNINGSTIDER
  # =================================================================================
  - name: kontakt-og-aabningstider
    label: Kontakt og åbningstider
    type: group
    items:
      # -----------------------------------------------------------------------------
      # KONTAKTOPLYSNINGER
      # -----------------------------------------------------------------------------
      - name: kontaktoplysninger
        label: Kontaktoplysninger
        type: file
        path: content/site/contact.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: primaryPhone
            label: Telefon
            type: string
            required: true
            description: >-
              Hovednummeret. Det er det, alle "ring op"-knapper på sitet bruger. Otte
              cifre, fx "+45 63 90 83 00" eller "63 90 83 00".
          - name: secondaryPhone
            label: Ekstra telefon
            type: string
            description: Otte cifre. Må gerne stå tom.
          - name: email
            label: E-mail
            type: string
            required: true
          - name: facebookUrl
            label: Facebook-side
            type: string
            description: >-
              Fuld adresse til restaurantens egen Facebook-side, fx
              "https://www.facebook.com/carlnielsencafeen".

          - name: venueName
            label: Stedets navn
            type: string
            readonly: true
            description: >-
              Adressen er låst, fordi kortet på "Find os" peger på præcis dette sted.
              Skal den rettes, skal kortet rettes med.
          - name: addressLine1
            label: Vej og nummer
            type: string
            readonly: true
          - name: postalCode
            label: Postnummer
            type: string
            readonly: true
          - name: city
            label: By
            type: string
            readonly: true

      # -----------------------------------------------------------------------------
      # ÅBNINGSTIDER
      # -----------------------------------------------------------------------------
      - name: aabningstider
        label: Åbningstider
        type: file
        path: content/site/hours.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: schedule
            label: Almindelig uge
            type: object
            description: >-
              Sæt "Lukket" til på de dage, I holder lukket, og lad "Fra" og "Til" stå
              tomme. På en åben dag skal begge tidspunkter udfyldes, og der lukkes
              senere på dagen, end der åbnes.
            fields:
              - name: mon
                component: ugedag
                label: Mandag
              - name: tue
                component: ugedag
                label: Tirsdag
              - name: wed
                component: ugedag
                label: Onsdag
              - name: thu
                component: ugedag
                label: Torsdag
              - name: fri
                component: ugedag
                label: Fredag
              - name: sat
                component: ugedag
                label: Lørdag
              - name: sun
                component: ugedag
                label: Søndag

          - name: overrides
            label: Særlige dage
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date}"
            description: >-
              Helligdage, ferielukning og dage med andre tider end normalt. En dato kan
              kun stå ét sted, når den er sat til "Vises på siden".
            fields:
              - name: date
                label: Dato
                type: date
                required: true
                options:
                  format: yyyy-MM-dd
              - name: kind
                label: Type
                type: select
                default: closed
                options:
                  values:
                    - name: closed
                      label: Lukket hele dagen
                    - name: custom
                      label: Andre tider end normalt
              - name: opensAt
                label: Åbner
                type: string
                pattern:
                  regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                  message: Skriv klokkeslættet som 12:00.
                description: >-
                  Udfyldes kun ved "Andre tider end normalt". Skrives som 12:00.
              - name: closesAt
                label: Lukker
                type: string
                pattern:
                  regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                  message: Skriv klokkeslættet som 16:00.
                description: >-
                  Udfyldes kun ved "Andre tider end normalt". Skrives som 16:00.
              - name: status
                label: Status
                type: select
                default: draft
                options:
                  values:
                    - name: draft
                      label: Kladde — vises ikke
                    - name: published
                      label: Vises på siden

  # =================================================================================
  # UDMÆRKELSE
  # =================================================================================
  - name: udmaerkelse
    label: Udmærkelse
    type: file
    path: content/site/award.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: Overskrift
        type: string
        readonly: true
      - name: text
        label: Tekst
        type: text
        readonly: true
        description: >-
          Teksten om konkurrencen er låst. Den gengiver et resultat, der er afgjort
          udefra, og skal ikke kunne skrives om i forbifarten. Sig til, hvis den skal
          rettes.
