name: Production migrations

# The production migration door — technical plan §10b; phase 14A.
#
# One job, one script: `scripts/launch/migrate.mjs`, the same command an
# operator runs from a terminal (`npm run launch:migrate`). It reads the
# target's applied migrations, refuses a divergent or newer history, and applies
# the repository's pending migrations in order — migrations ONLY: no seed file,
# no development content, no confirmed content, no Owner. Those are separate
# explicit commands and never part of a deployment. No migration logic lives
# here; this file only hands the script its environment.
#
# NOT YET LIVE (phase 14A). The only trigger is a manual dispatch, so no merge to
# `main` fails while the production project and its protected environment do
# not exist. Phase 14C activates it, in this order:
#
#   1. create the protected GitHub environment `production` (required reviewers:
#      the repository owner; deployment branch: `main` only);
#   2. add to it the secret SUPABASE_DB_URL (the production project's SESSION
#      pooler string, port 5432) and the variable MIGRATE_CONFIRM_HOST
#      (`<ref>.supabase.co`, the production project's host, typed on purpose —
#      the script refuses any other target);
#   3. run this workflow once by hand (Actions → Production migrations → Run
#      workflow) against the fresh project and read the log: `history: target
#      has 0 migration(s) (no history table yet)`, then `applied:` per file;
#   4. add the push trigger, so every merge to `main` applies pending migrations
#      before Vercel promotes the build (§10b):
#
#        on:
#          push:
#            branches: [main]
#          workflow_dispatch:
#
#      and record the date in docs/runbooks/launch-notes.md.
#
# Secrets reach the script as environment variables, never as arguments; `set -x`
# is forbidden here and checked by `npm run check:policy`. Third-party actions
# are pinned by commit SHA (§14).

on:
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# Two migration runs must never race — a second run waits for the first.
concurrency:
  group: production-migrate
  cancel-in-progress: false

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  # The unused Sentry CLI's postinstall must not download anything (technical
  # plan section 0aj, 0ak), as in every other workflow of this repository.
  SENTRYCLI_SKIP_DOWNLOAD: 1

jobs:
  migrate:
    name: Apply pending migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # psql 17 from the official image through the runner's Docker, exactly as the
      # backup workflow does; the connection reaches libpq through PG* variables.
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATE_CONFIRM_HOST: ${{ vars.MIGRATE_CONFIRM_HOST }}
          BACKUP_PG_MODE: docker
        run: node scripts/launch/migrate.mjs
