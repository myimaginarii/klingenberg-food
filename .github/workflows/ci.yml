name: CI

# CI (technical plan §9, §14).
#
# The site is a static export with no backend, so the pipeline is short and needs no
# credentials of any kind: typecheck -> lint -> source policy -> unit tests, then the
# build and the browser suite against the generated `out/` directory, plus `npm audit`
# and CodeQL.
#
# Third-party actions are pinned by commit SHA, never by tag (§14) — a moving tag is a
# supply-chain hole. The comment records which release each SHA is.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# There are no credentials to give this workflow. Read-only by default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps CI output free of interactive noise and progress spinners.
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` — never a resolving install. Fails if the lockfile is out of date (§14).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No hard-coded domains, no `set -x`, and no backend of any kind (§8, §10d).
      - name: Source policy
        run: npm run check:policy

      - name: Unit tests
        run: npm test

  browser:
    name: Build, browser and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium. The public site uses no browser-specific API, and a second engine
      # would double the slowest job in the pipeline for no new information.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` builds the export and serves `out/` itself — the same
      # files, served the same way, as the deployed site.
      - name: Build and run the browser suite
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocks the pipeline on a high or critical advisory (§14). Dependabot handles
      # the routine upgrades; this catches anything that lands between them.
      - name: npm audit
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
