name: Backup

# The weekly off-platform backup — technical plan §10f, §14; phase 13A.
#
# One job, one script. `scripts/backup/backup.mjs` dumps the production database
# (pg_dump: the public schema, every application table, the durable auth tables),
# copies both Storage buckets through the Storage API, writes a manifest, uploads
# the recovery point to the off-platform bucket with the AWS CLI, lists it back,
# and only then moves `latest.json`. The same script is the manual command
# (`npm run backup`), so the schedule and an operator run identical logic.
#
# Two schedules, one tier each: the weekly cron writes under `<prefix>/weekly/`,
# the monthly one under `<prefix>/monthly/`. Retention is the destination
# bucket's lifecycle rule per prefix (docs/runbooks/backups.md) — nothing here
# deletes anything.
#
# Secrets live ONLY in the protected `backup` environment (§10e, §10f): a fork,
# a pull request or a branch without access to that environment has nothing to
# read. They reach the script as environment variables, never as arguments;
# `set -x` is forbidden here and checked by `npm run check:policy`. A failed run
# is a failed workflow run — GitHub notifies the repository owner (§10f "failure
# is loud"); no further notification service exists in 13A.
#
# Third-party actions are pinned by commit SHA (§14). The comment records which
# release each SHA is; Dependabot rewrites both.

on:
  schedule:
    # Mondays 03:17 UTC (05:17 Copenhagen in summer, 04:17 in winter).
    - cron: '17 3 * * 1'
    # The first of every month, 04:17 UTC — the monthly tier.
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which retention tier this recovery point belongs to'
        type: choice
        default: weekly
        options:
          - weekly
          - monthly

# Nothing in this workflow writes to the repository. Checkout needs to read it.
permissions:
  contents: read

# Two backups must never race — a second run waits for the first to finish.
concurrency:
  group: backup
  cancel-in-progress: false

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  # `@sentry/cli` (a transitive dependency of the unused Sentry build plugin) runs a
  # postinstall that falls back to downloading its binary from Sentry's CDN when the
  # lockfile's optional platform package is absent. This project never runs the CLI
  # (no source-map upload, no build wrapper - technical plan section 0aj, 0ak), so the
  # supported switch turns the fallback off. Enabling source-map upload later means
  # removing this line wherever the build runs.
  SENTRYCLI_SKIP_DOWNLOAD: 1

jobs:
  backup:
    name: Weekly off-platform backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: backup

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The backup tooling needs @supabase/supabase-js and nothing else from the
      # tree; `npm ci` keeps it on the lockfile like every other job (§14).
      - name: Install dependencies
        run: npm ci

      # The tier is the cron that fired, or the dispatch input.
      - name: Decide the tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 4 1 * *" ]; then
            echo "tier=monthly" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tier=${{ inputs.tier }}" >> "$GITHUB_OUTPUT"
          else
            echo "tier=weekly" >> "$GITHUB_OUTPUT"
          fi

      # pg_dump must be at least the server's major version (17). The runner image
      # ships an older client, so the tooling is told to use the postgres:17 image
      # through the runner's Docker instead of guessing.
      - name: Create and ship the recovery point
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_PG_MODE: docker
        run: node scripts/backup/backup.mjs --out "$RUNNER_TEMP/recovery" --tier "${{ steps.tier.outputs.tier }}" --ship

      # The recovery point holds production data. It is never uploaded as a
      # workflow artifact (brief §25); the runner's disk is discarded with the job.
      - name: Remove the local copy
        if: always()
        run: rm -rf "$RUNNER_TEMP/recovery"
