<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Klingenberg Food</title>
  <!--
    PLACEHOLDER, not the restaurant's mark.

    Design frame 1ab lists both "Logofil i vektor (SVG/AI)" and "Godkendelse af beskåret
    K til favicon" as outstanding, so no logo glyph is drawn here — inventing one would
    be inventing a brand. This is the brand burgundy (#720401) on the site's cream, which
    is enough for a browser tab to be recognisable and enough to stop every page request
    404ing on /favicon.ico. The approved icon replaces this file at launch (phase 14).
  -->
  <rect width="64" height="64" rx="14" fill="#720401"/>
  <rect x="6" y="6" width="52" height="52" rx="9" fill="none" stroke="#FBF7F0" stroke-opacity="0.55" stroke-width="2"/>
</svg>
